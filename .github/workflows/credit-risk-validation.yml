name: Credit risk validation lab
on:
  pull_request:
    paths:
      - '03-financial-risk/01-credit-risk/production-credit-risk-lab/**'
      - '.github/workflows/credit-risk-validation.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s 03-financial-risk/01-credit-risk/production-credit-risk-lab/tests -v
