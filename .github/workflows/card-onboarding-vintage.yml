name: Card onboarding vintage lab
on:
  pull_request:
    paths:
      - '03-financial-risk/01-credit-risk/credit-vintage-snapshot-lab/**'
      - '.github/workflows/card-onboarding-vintage.yml'
  workflow_dispatch:
jobs:
  unit-and-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements-research.txt
      - name: Unit tests
        run: python -m unittest discover -s 03-financial-risk/01-credit-risk/credit-vintage-snapshot-lab/tests -v
      - name: Execute lab notebooks
        run: |
          python scripts/execute_notebooks.py --output artifacts/notebooks \
            03-financial-risk/01-credit-risk/credit-vintage-snapshot-lab/*.ipynb
