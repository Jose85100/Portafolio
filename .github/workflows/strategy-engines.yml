name: Strategy Decision Engines
on:
  push:
    paths:
      - '06-strategy-innovation-and-leadership/**'
      - '.github/workflows/strategy-engines.yml'
  pull_request:
    paths:
      - '06-strategy-innovation-and-leadership/**'
      - '.github/workflows/strategy-engines.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test five decision engines
        shell: bash
        run: |
          set -euo pipefail
          for project in 06-strategy-innovation-and-leadership/0[1-5]-*; do
            python -m unittest discover -s "$project/tests" -p 'test_*.py' -v
          done
