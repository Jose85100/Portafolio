name: OU finite-step audit

on:
  pull_request:
    paths:
      - '02-mathematics-statistics-and-quant/advanced-research/01-stochastic-critical-transitions/**'
      - '.github/workflows/ou-critical-transitions.yml'
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install, test and reproduce
        run: make -C 02-mathematics-statistics-and-quant/advanced-research/01-stochastic-critical-transitions run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ou-audit-evidence
          path: |
            02-mathematics-statistics-and-quant/advanced-research/01-stochastic-critical-transitions/benchmarks/
            02-mathematics-statistics-and-quant/advanced-research/01-stochastic-critical-transitions/notebook.ipynb
            02-mathematics-statistics-and-quant/advanced-research/01-stochastic-critical-transitions/informe.md
