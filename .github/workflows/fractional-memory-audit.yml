name: Fractional memory audit

on:
  pull_request:
    paths:
      - '02-mathematics-statistics-and-quant/advanced-research/05-fractional-long-memory-systems/**'
      - '.github/workflows/fractional-memory-audit.yml'
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install, test and reproduce
        run: make -C 02-mathematics-statistics-and-quant/advanced-research/05-fractional-long-memory-systems run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fractional-memory-evidence
          path: |
            02-mathematics-statistics-and-quant/advanced-research/05-fractional-long-memory-systems/benchmarks/
            02-mathematics-statistics-and-quant/advanced-research/05-fractional-long-memory-systems/notebook.ipynb
            02-mathematics-statistics-and-quant/advanced-research/05-fractional-long-memory-systems/informe.md
