name: Canonical Drive source contracts
on:
  pull_request:
    paths:
      - 'data-governance/observed-financial-marts/src/drive_readonly.py'
      - 'data-governance/observed-financial-marts/src/sfc_product_profile.py'
      - 'data-governance/observed-financial-marts/src/market_sqlite_profile.py'
      - 'data-governance/observed-financial-marts/tests/test_drive_source_profiles.py'
      - 'data-governance/observed-financial-marts/src/run_canonical_sources.py'
      - 'data-governance/observed-financial-marts/src/observed_market_var.py'
      - '.github/workflows/drive-canonical-source-contracts.yml'
  workflow_dispatch:
jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate script syntax
        run: python -m compileall -q data-governance/observed-financial-marts/src
      - name: Validate read-only source contracts
        run: python -m unittest discover -s data-governance/observed-financial-marts/tests -p test_drive_source_profiles.py -v
