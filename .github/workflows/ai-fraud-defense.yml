name: AI fraud defense research
on:
  pull_request:
    paths:
      - '03-financial-risk/01-credit-risk/fraud-and-anomaly-research/ai-enabled-fraud-defense/**'
      - 'scripts/execute_research_depth.py'
      - '.github/workflows/ai-fraud-defense.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODULE: 03-financial-risk/01-credit-risk/fraud-and-anomaly-research/ai-enabled-fraud-defense
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install direct dependencies
        run: python -m pip install -r "$MODULE/requirements.txt" ruff==0.17.2
      - name: Validate editable diagram generation
        run: |
          python -m ruff check "$MODULE/build_architectures.py" "$MODULE/build_notebook.py"
          python "$MODULE/build_architectures.py"
          git diff --exit-code -- "$MODULE/diagrams"
      - name: Generate and execute notebook with a fresh kernel
        run: |
          python "$MODULE/build_notebook.py"
          python scripts/execute_research_depth.py --one "$MODULE/notebook.ipynb" --mode kernel --result "$GITHUB_WORKSPACE/fraud-artifacts/execution.json" --qa-dir "$GITHUB_WORKSPACE/fraud-artifacts"
      - name: Require all three rendered figures
        run: python -c 'import json, os, pathlib; p=pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"fraud-artifacts/execution.json"; r=json.loads(p.read_text()); assert r["figures"] == 3, r'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-fraud-defense-evidence
          path: fraud-artifacts
          if-no-files-found: ignore
