name: Copula finite-tail audit

on:
  pull_request:
    paths:
      - '02-mathematics-statistics-and-quant/advanced-research/04-nonlinear-tail-dependence/**'
      - '.github/workflows/copula-tail-audit.yml'
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install, test and reproduce
        run: make -C 02-mathematics-statistics-and-quant/advanced-research/04-nonlinear-tail-dependence run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copula-tail-evidence
          path: |
            02-mathematics-statistics-and-quant/advanced-research/04-nonlinear-tail-dependence/benchmarks/
            02-mathematics-statistics-and-quant/advanced-research/04-nonlinear-tail-dependence/notebook.ipynb
            02-mathematics-statistics-and-quant/advanced-research/04-nonlinear-tail-dependence/informe.md
