name: Categorical geometry audit

on:
  pull_request:
    paths:
      - '02-mathematics-statistics-and-quant/advanced-research/02-information-geometry-statistical-manifolds/**'
      - '.github/workflows/categorical-geometry-audit.yml'
      - 'requirements-research.*'
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install, test and reproduce
        run: make -C 02-mathematics-statistics-and-quant/advanced-research/02-information-geometry-statistical-manifolds run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: categorical-geometry-evidence
          path: |
            02-mathematics-statistics-and-quant/advanced-research/02-information-geometry-statistical-manifolds/benchmarks/
            02-mathematics-statistics-and-quant/advanced-research/02-information-geometry-statistical-manifolds/notebook.ipynb
            02-mathematics-statistics-and-quant/advanced-research/02-information-geometry-statistical-manifolds/informe.md
