name: Gauge identifiability certificate

on:
  push:
    paths:
      - "02-mathematics-statistics-and-quant/advanced-research/12-statistical-gauge-invariance/**"
      - ".github/workflows/gauge-identifiability.yml"
  pull_request:
    paths:
      - "02-mathematics-statistics-and-quant/advanced-research/12-statistical-gauge-invariance/**"
      - ".github/workflows/gauge-identifiability.yml"

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Reproduce complete MVP
        working-directory: 02-mathematics-statistics-and-quant/advanced-research/12-statistical-gauge-invariance
        run: make run
      - name: Re-execute notebook in a conventional kernel
        working-directory: 02-mathematics-statistics-and-quant/advanced-research/12-statistical-gauge-invariance
        run: .venv/bin/python scripts_notebook.py --kernel
      - uses: actions/upload-artifact@v4
        with:
          name: gauge-identifiability-evidence
          path: |
            02-mathematics-statistics-and-quant/advanced-research/12-statistical-gauge-invariance/benchmarks
            02-mathematics-statistics-and-quant/advanced-research/12-statistical-gauge-invariance/notebook.ipynb
            02-mathematics-statistics-and-quant/advanced-research/12-statistical-gauge-invariance/informe.md
