name: Credit fraud loss engine
on:
  push:
    paths:
      - '03-financial-risk/01-credit-risk/fraud-and-anomaly-research/**'
      - '.github/workflows/credit-fraud-loss.yml'
  pull_request:
    paths:
      - '03-financial-risk/01-credit-risk/fraud-and-anomaly-research/**'
      - '.github/workflows/credit-fraud-loss.yml'
permissions:
  contents: read
jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    defaults:
      run:
        working-directory: 03-financial-risk/01-credit-risk/fraud-and-anomaly-research/loss-minimization-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python run_experiment.py
      - uses: actions/upload-artifact@v4
        with:
          name: credit-fraud-synthetic-results
          path: 03-financial-risk/01-credit-risk/fraud-and-anomaly-research/loss-minimization-engine/results/
