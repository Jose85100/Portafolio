name: Financial risk model contracts
on:
  push:
    paths:
      - '03-financial-risk/01-credit-risk/credit-risk-products/ifrs9-investigacion-cuantitativa/**'
      - '03-financial-risk/03-market-liquidity-research/**'
      - '03-financial-risk/07-financial-and-construction-risk-lab/tests/fixtures/**'
      - '.github/workflows/financial-risk-contracts.yml'
  pull_request:
    paths:
      - '03-financial-risk/01-credit-risk/credit-risk-products/ifrs9-investigacion-cuantitativa/**'
      - '03-financial-risk/03-market-liquidity-research/**'
      - '03-financial-risk/07-financial-and-construction-risk-lab/tests/fixtures/**'
      - '.github/workflows/financial-risk-contracts.yml'
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-runtime.txt
      - name: IFRS 9 input and cash-flow contracts
        run: python -m unittest discover -s 03-financial-risk/01-credit-risk/credit-risk-products/ifrs9-investigacion-cuantitativa/tests -v
      - name: Market-liquidity risk and shared tail fixtures
        run: python -m unittest discover -s 03-financial-risk/03-market-liquidity-research/tests -v
