name: Data Engineering Risk Platform
on:
  push:
    paths:
      - '05-ai-and-automation/data-engineering/**'
      - '.github/workflows/data-engineering-risk-platform.yml'
  pull_request:
    paths:
      - '05-ai-and-automation/data-engineering/**'
      - '.github/workflows/data-engineering-risk-platform.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s 05-ai-and-automation/data-engineering/risk-data-platform/tests -v
