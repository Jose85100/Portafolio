name: Bayesian inverse stability audit
on:
  push:
    paths:
      - '02-mathematics-statistics-and-quant/advanced-research/08-bayesian-inverse-uncertainty/**'
      - '.github/workflows/bayesian-inverse-audit.yml'
  pull_request:
    paths:
      - '02-mathematics-statistics-and-quant/advanced-research/08-bayesian-inverse-uncertainty/**'
      - '.github/workflows/bayesian-inverse-audit.yml'
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce complete MVP
        working-directory: 02-mathematics-statistics-and-quant/advanced-research/08-bayesian-inverse-uncertainty
        run: make run
