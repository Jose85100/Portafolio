name: Economics quadratic root certificate
on:
  push:
    paths:
      - '01-economics-and-econometrics/computational-economics/numerical-validation/quadratic-root-certificate/**'
      - '01-economics-and-econometrics/computational-economics/src/**'
      - '01-economics-and-econometrics/computational-economics/tests/**'
      - '.github/workflows/economics-quadratic-root-certificate.yml'
  pull_request:
    paths:
      - '01-economics-and-econometrics/computational-economics/numerical-validation/quadratic-root-certificate/**'
      - '01-economics-and-econometrics/computational-economics/src/**'
      - '01-economics-and-econometrics/computational-economics/tests/**'
      - '.github/workflows/economics-quadratic-root-certificate.yml'
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash 01-economics-and-econometrics/computational-economics/numerical-validation/quadratic-root-certificate/reproduce.sh
