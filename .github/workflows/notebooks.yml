name: Notebook Reliability

on:
  pull_request:
    paths:
      - '**/*.ipynb'
      - 'scripts/execute_notebooks.py'
      - 'tests/test_notebooks.py'
      - 'requirements*.txt'
      - '.github/workflows/notebooks.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  changed-notebooks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements-research.txt
      - run: python -m py_compile scripts/execute_notebooks.py tests/test_notebooks.py
      - name: Execute notebooks modified by this pull request
        run: |
          mapfile -t changed < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- '**/*.ipynb')
          if [ "${#changed[@]}" -eq 0 ]; then exit 0; fi
          python scripts/execute_notebooks.py --output artifacts/notebooks "${changed[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: changed-notebook-results
          path: artifacts/notebooks
          if-no-files-found: ignore

  full-notebook-regression:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements-research.txt
      - run: python -m py_compile scripts/execute_notebooks.py tests/test_notebooks.py
      - run: python scripts/execute_notebooks.py --all --output artifacts/notebooks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-notebook-results-${{ github.run_id }}
          path: artifacts/notebooks
          retention-days: 30
