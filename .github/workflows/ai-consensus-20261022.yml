        with:
          python-version: '3.12'
      - name: Reproduce
        run: bash 05-artificial-intelligence-and-computational-systems/10-ai-orchestration-engineering/02-multi-agent-coordination-consensus/mvp-correlated-consensus/reproduce.sh
