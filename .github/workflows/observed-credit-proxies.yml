name: Observed credit data adapter
on:
  pull_request:
    paths:
      - '03-financial-risk/01-credit-risk/observed-data-proxies/**'
      - '.github/workflows/observed-credit-proxies.yml'
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s 03-financial-risk/01-credit-risk/observed-data-proxies/tests -v
