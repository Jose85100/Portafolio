name: ALM observed funding research
on:
  pull_request:
    paths:
      - '04-quant-strategy-and-products/treasury-and-alm/observed-funding-research/**'
      - '.github/workflows/observed-alm-funding.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run ALM research tests
        run: python -m unittest discover -s 04-quant-strategy-and-products/treasury-and-alm/observed-funding-research/tests -v
      - name: Syntax and contracts
        run: python -m compileall -q 04-quant-strategy-and-products/treasury-and-alm/observed-funding-research/src
