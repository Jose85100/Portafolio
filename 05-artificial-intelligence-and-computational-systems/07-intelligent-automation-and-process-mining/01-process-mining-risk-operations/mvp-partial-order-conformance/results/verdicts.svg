<svg xmlns="http://www.w3.org/2000/svg" width="850" height="340" viewBox="0 0 850 340"><rect width="850" height="340" fill="white"/><g font-family="sans-serif" font-size="15" fill="#243746"><text x="30" y="30">Conformance when tied timestamps conceal event order</text><text x="30" y="58">Wrong definite verdicts (red), abstentions (blue), per 100 synthetic cases</text><text x="30" y="118">arbitrary</text><rect x="145" y="100" width="168.0" height="25" fill="#CC6677"/><rect x="313.0" y="100" width="0.0" height="25" fill="#4477AA"/><text x="323.0" y="119">wrong 21.0; abstain 0.0</text><text x="30" y="183">optimistic</text><rect x="145" y="165" width="160.0" height="25" fill="#CC6677"/><rect x="305.0" y="165" width="0.0" height="25" fill="#4477AA"/><text x="315.0" y="184">wrong 20.0; abstain 0.0</text><text x="30" y="248">bounds</text><rect x="145" y="230" width="0.0" height="25" fill="#CC6677"/><rect x="145.0" y="230" width="320.0" height="25" fill="#4477AA"/><text x="475.0" y="249">wrong 0.0; abstain 40.0</text><text x="30" y="320">Abstention preserves uncertainty; it does not recover the hidden true order.</text></g></svg>