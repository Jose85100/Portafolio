[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "nbformat.*", "nbclient.*"]
ignore_missing_imports = true
